name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      # ffmpeg 가 필요한 테스트가 있어 설치
      - run: brew install ffmpeg
      - run: bun test
      - name: 계약 fixtures 검증 (ajv-cli)
        run: spec/validate.sh
